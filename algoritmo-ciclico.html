<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Algoritmo Cíclico | Saikio Algorithm</title>

<style>

/* =========================
   CONFIGURACIÓN GENERAL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: "Segoe UI", sans-serif;
    color: #5b4b4b;
    background: #f7eee8;
    overflow-x: hidden;
}


/* =========================
   FONDO ANIMADO
========================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -2;
    background:
        linear-gradient(
            135deg,
            #f8eee8,
            #f9e6e8,
            #f7eddf,
            #f8e9e4
        );
}

.luz {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.45;
    animation: movimiento 12s ease-in-out infinite alternate;
}

.luz-rosa {
    width: 300px;
    height: 300px;
    background: #e8b8c5;
    top: 8%;
    left: 8%;
}

.luz-amarilla {
    width: 260px;
    height: 260px;
    background: #f4d68e;
    bottom: 10%;
    right: 10%;
    animation-delay: 2s;
}

.luz-beige {
    width: 230px;
    height: 230px;
    background: #ead2c5;
    top: 45%;
    left: 55%;
    animation-delay: 4s;
}

@keyframes movimiento {
    0% {
        transform: translate(0, 0) scale(1);
    }
    50% {
        transform: translate(35px, -25px) scale(1.08);
    }
    100% {
        transform: translate(-25px, 30px) scale(0.96);
    }
}


/* =========================
   DECORACIONES
========================= */

.decoracion {
    position: fixed;
    pointer-events: none;
    z-index: -1;
    opacity: 0.7;
}

.sakura {
    font-size: 24px;
    animation: flotar 6s ease-in-out infinite;
}

.sakura-1 {
    top: 15%;
    left: 8%;
}

.sakura-2 {
    top: 25%;
    right: 8%;
    animation-delay: 2s;
}

.sakura-3 {
    bottom: 15%;
    left: 12%;
    animation-delay: 3s;
}

.sakura-4 {
    bottom: 20%;
    right: 13%;
    animation-delay: 1s;
}

@keyframes flotar {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }
    50% {
        transform: translateY(-12px) rotate(8deg);
    }
}


/* =========================
   ENCABEZADO
========================= */

header {
    width: 100%;
    padding: 28px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    line-height: 1;
}

.logo-principal {
    font-size: 23px;
    letter-spacing: 4px;
    font-weight: 600;
    color: #765b61;
}

.logo-secundario {
    font-size: 11px;
    letter-spacing: 5px;
    color: #b58b95;
    margin-top: 6px;
}

.volver {
    text-decoration: none;
    color: #765b61;
    background: rgba(255,255,255,0.65);
    border: 1px solid rgba(181,139,149,0.25);
    padding: 11px 19px;
    border-radius: 30px;
    font-size: 13px;
    transition: 0.3s;
    backdrop-filter: blur(8px);
}

.volver:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,0.9);
}


/* =========================
   CONTENIDO
========================= */

main {
    width: 100%;
    min-height: calc(100vh - 100px);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 35px 20px 70px;
}

.etiqueta {
    font-size: 11px;
    letter-spacing: 4px;
    color: #b1848d;
    margin-bottom: 12px;
}

h1 {
    font-size: clamp(30px, 5vw, 48px);
    font-weight: 500;
    color: #654f55;
    text-align: center;
    margin-bottom: 10px;
}

.subtitulo {
    font-size: 17px;
    color: #9b7b81;
    text-align: center;
    margin-bottom: 12px;
}

.descripcion {
    max-width: 650px;
    text-align: center;
    line-height: 1.7;
    font-size: 14px;
    color: #806d70;
    margin-bottom: 35px;
}


/* =========================
   CONTENEDOR DE LA ANIMACIÓN
========================= */

.animacion-contenedor {
    width: min(900px, 90vw);
    display: flex;
    flex-direction: column;
    align-items: center;
}


/* Marco 3:2 */

.marco-imagen {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 2;
    max-height: 600px;
    overflow: hidden;
    border-radius: 28px;
    background: #eee1d8;
    border: 1px solid rgba(150,110,115,0.15);
    box-shadow:
        0 25px 55px rgba(111, 78, 82, 0.16),
        0 5px 15px rgba(111, 78, 82, 0.08);
}


/* Imágenes Superpuestas para Transición Suave */

.imagen-capa {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    top: 0;
    left: 0;
    transition: opacity 0.4s ease-in-out; /* Controla qué tan suave y rápido es el fundido */
}

.oculta {
    opacity: 0;
}

.visible {
    opacity: 1;
}


/* =========================
   BOTÓN
========================= */

.boton-control {
    margin-top: 22px;
    min-width: 150px;
    padding: 13px 30px;
    border: none;
    border-radius: 30px;
    background: #c98f9d;
    color: white;
    font-size: 14px;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(150, 92, 105, 0.22);
    transition: 0.3s;
}

.boton-control:hover {
    transform: translateY(-3px);
    background: #bd7f8e;
    box-shadow: 0 12px 25px rgba(150, 92, 105, 0.28);
}

.boton-control:active {
    transform: translateY(0);
}


/* =========================
   INFORMACIÓN DEL ALGORITMO
========================= */

.info {
    margin-top: 28px;
    padding: 12px 20px;
    border-radius: 25px;
    background: rgba(255,255,255,0.45);
    border: 1px solid rgba(180,140,145,0.12);
    font-size: 12px;
    color: #9b8084;
    backdrop-filter: blur(8px);
}

.estado {
    font-weight: 600;
    color: #ad7884;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {
    header {
        padding: 22px 5%;
    }
    .logo-principal {
        font-size: 19px;
    }
    .logo-secundario {
        font-size: 9px;
    }
    .volver {
        font-size: 11px;
        padding: 9px 13px;
    }
    main {
        padding-top: 25px;
    }
    .descripcion {
        font-size: 13px;
    }
    .marco-imagen {
        border-radius: 20px;
    }
    .boton-control {
        min-width: 140px;
    }
}

</style>
</head>


<body>

<!-- =========================
     FONDO
========================= -->
<div class="background">
    <div class="luz luz-rosa"></div>
    <div class="luz luz-amarilla"></div>
    <div class="luz luz-beige"></div>
</div>

<!-- =========================
     DECORACIONES
========================= -->
<div class="decoracion sakura sakura-1">🌸</div>
<div class="decoracion sakura sakura-2">✦</div>
<div class="decoracion sakura sakura-3">🌸</div>
<div class="decoracion sakura sakura-4">✧</div>

<!-- =========================
     ENCABEZADO
========================= -->
<header>
    <div class="logo">
        <div class="logo-principal">SAIKIO</div>
        <div class="logo-secundario">ALGORITHM</div>
    </div>
    <a href="algoritmos.html" class="volver">← Volver a algoritmos</a>
</header>

<!-- =========================
     CONTENIDO PRINCIPAL
========================= -->
<main>
    <div class="etiqueta">ALGORITMO CÍCLICO</div>

    <h1>Una escena en movimiento.</h1>

    <div class="subtitulo">Un ciclo que vuelve a comenzar.</div>

    <p class="descripcion">
        Presiona iniciar para reproducir continuamente la secuencia.
        Las imágenes seguirán un orden cíclico hasta que decidas detenerla.
    </p>

    <!-- =========================
         ANIMACIÓN (Doble Capa)
    ========================= -->
    <div class="animacion-contenedor">

        <!-- Marco con dos imágenes superpuestas -->
        <div class="marco-imagen">
            <img id="imgCapa1" class="imagen-capa visible" src="imagenprincipal.png" alt="Capa 1">
            <img id="imgCapa2" class="imagen-capa oculta" src="" alt="Capa 2">
        </div>

        <!-- Botón -->
        <button
            id="botonControl"
            class="boton-control"
            onclick="controlarAlgoritmo()"
        >
            Iniciar
        </button>

        <!-- Estado -->
        <div class="info">
            Estado:
            <span id="estado" class="estado">Detenido</span>
        </div>

    </div>
</main>

<script>

/* ==========================================
   IMÁGENES DEL ALGORITMO
========================================== */

const imagenPrincipal = "imagenprincipal.png";

const imagenes = [
    "generated-image (1)(4).png",
    "generated-image (1)(2).png",
    "generated-image (1)(3).png",
    "generated-image (1)(2)(1).png"
];

/* ==========================================
   PRECARGA DE IMÁGENES
========================================== */
const imagenesPrecargadas = [];

[imagenPrincipal, ...imagenes].forEach((ruta) => {
    const img = new Image();
    img.src = ruta;
    imagenesPrecargadas.push(img);
});

/* ==========================================
   VARIABLES
========================================== */

let indice = 0;
let intervalo = null;
let ejecutando = false;
let capaActiva = 1; // Para llevar el control de cuál de las dos imágenes está arriba

/* ==========================================
   ELEMENTOS
========================================== */

const imgCapa1 = document.getElementById("imgCapa1");
const imgCapa2 = document.getElementById("imgCapa2");
const boton = document.getElementById("botonControl");
const estado = document.getElementById("estado");

/* ==========================================
   CAMBIAR IMAGEN (Efecto Fundido Cruzado)
========================================== */

function cambiarImagen() {
    const siguienteRuta = imagenes[indice];

    if (capaActiva === 1) {
        // Ponemos la siguiente imagen en la capa 2 y la hacemos aparecer suavemente
        imgCapa2.src = siguienteRuta;
        imgCapa2.classList.remove("oculta");
        imgCapa2.classList.add("visible");

        // Ocultamos la capa 1 de fondo
        imgCapa1.classList.remove("visible");
        imgCapa1.classList.add("oculta");

        capaActiva = 2;
    } else {
        // Ponemos la siguiente imagen en la capa 1 y la hacemos aparecer suavemente
        imgCapa1.src = siguienteRuta;
        imgCapa1.classList.remove("oculta");
        imgCapa1.classList.add("visible");

        // Ocultamos la capa 2 de fondo
        imgCapa2.classList.remove("visible");
        imgCapa2.classList.add("oculta");

        capaActiva = 1;
    }

    indice++;

    if (indice >= imagenes.length) {
        indice = 0;
    }
}

/* ==========================================
   INICIAR ALGORITMO
========================================== */

function iniciarAlgoritmo() {
    ejecutando = true;
    boton.textContent = "Detener";
    estado.textContent = "En ejecución";

    // Puedes ajustar los milisegundos (ej. 600 o 700) para que la transición sea más pausada si gustas
    intervalo = setInterval(() => {
        cambiarImagen();
    }, 600);
}

/* ==========================================
   DETENER ALGORITMO
========================================== */

function detenerAlgoritmo() {
    ejecutando = false;
    clearInterval(intervalo);
    intervalo = null;

    // Volvemos a la imagen principal en la capa activa de forma suave
    if (capaActiva === 1) {
        imgCapa2.src = imagenPrincipal;
        imgCapa2.classList.remove("oculta");
        imgCapa2.classList.add("visible");
        imgCapa1.classList.remove("visible");
        imgCapa1.classList.add("oculta");
        capaActiva = 2;
    } else {
        imgCapa1.src = imagenPrincipal;
        imgCapa1.classList.remove("oculta");
        imgCapa1.classList.add("visible");
        imgCapa2.classList.remove("visible");
        imgCapa2.classList.add("oculta");
        capaActiva = 1;
    }

    indice = 0;
    boton.textContent = "Iniciar";
    estado.textContent = "Detenido";
}

/* ==========================================
   BOTÓN INICIAR / DETENER
========================================== */

function controlarAlgoritmo() {
    if (ejecutando) {
        detenerAlgoritmo();
    } else {
        iniciarAlgoritmo();
    }
}

</script>

</body>
</html>
